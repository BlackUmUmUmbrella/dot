theme = "my_catppuccin_mocha"

[editor]
line-number = "relative"
cursorline = true
continue-comments = false
true-color = true
bufferline = "always"
color-modes = true
mouse = false

[editor.statusline]
left = ["mode", "file-name"]
center = ["spinner"]
right = ["diagnostics", "selections", "position", "file-encoding", "file-line-ending", "file-type"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"
diagnostics = ["warning", "error"]
workspace-diagnostics = ["warning", "error"]

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.auto-pairs]
'(' = ')'
'{' = '}'
'[' = ']'
'"' = '"'
'`' = '`'
'<' = '>'

[editor.indent-guides]
render = true
character = "│"
skip-levels = 0
